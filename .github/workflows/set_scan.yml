name: SET MAI Momentum Scanner

on:
  schedule:
    # รันเวลา 12:00 น. ตามเวลาไทย (05:00 UTC) เฉพาะวันจันทร์ - ศุกร์
    - cron: '0 5 * * 1-5'


  workflow_dispatch: # อนุญาตให้กดปุ่มรันแบบ Manual ได้

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas-ta requests pytz
        
      - name: Run Trend Following Scanner
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: python scan_trend_set.py
