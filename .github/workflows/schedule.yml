name: Daily Trend Screener

on:
  schedule:
    # ตั้งเวลาทำงาน: 21:30 UTC วันจันทร์-ศุกร์ (ตรงกับ 04:30 น. เวลาไทย)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # เปิดให้เรากดปุ่มสั่งรันเองได้ตลอดเวลาเพื่อทดสอบ

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install yfinance pandas pandas-ta requests lxml html5lib

      - name: Run Python Script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python screener.py
